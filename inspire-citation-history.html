    <script>
        // --------------------------------
        // GLOBAL VARIABLES / STATE
        // --------------------------------
        const COLORS = [
            '#e41a1c', '#377eb8', '#4daf4a', '#984ea3', 
            '#ff7f00', '#ffff33', '#a65628', '#f781bf'
        ];
        
        let recidData = {};   // recid -> { dates: [array of date strings] }
        let chart = null;     // The single Chart.js instance
        let chartData = null; // Global variable to store chart data for export
        let debugInfo = [];   // For debug logs
        let isLoading = false; // Flag to track loading state
        let rateChart = null; // Chart.js instance for the citation-rate view
        let rateData = null;  // Binned rate series per record, for CSV export
        
        // --------------------------------
        // DEBUG LOGGING
        // --------------------------------
        function logDebug(message, data = null) {
            const timestamp = new Date().toISOString();
            let logMessage = `[${timestamp}] ${message}`;
            
            if (data !== null) {
                if (typeof data === 'object') {
                    logMessage += `\n${JSON.stringify(data, null, 2)}`;
                } else {
                    logMessage += `\n${data}`;
                }
            }
            
            console.log(logMessage);
            debugInfo.push(logMessage);
            
            // Update debug info display if visible
            const debugInfoElement = document.getElementById('debug-info');
            if (debugInfoElement.style.display !== 'none') {
                debugInfoElement.textContent = debugInfo.join('\n\n');
                debugInfoElement.scrollTop = debugInfoElement.scrollHeight;
            }
        }
        
        function toggleDebugInfo() {
            const debugInfoElement = document.getElementById('debug-info');
            const toggleButton = document.getElementById('toggle-debug');
            
            if (debugInfoElement.style.display === 'none') {
                debugInfoElement.style.display = 'block';
                debugInfoElement.textContent = debugInfo.join('\n\n');
                toggleButton.textContent = 'Hide Debug Info';
                debugInfoElement.scrollTop = debugInfoElement.scrollHeight;
            } else {
                debugInfoElement.style.display = 'none';
                toggleButton.textContent = 'Show Debug Info';
            }
        }
        
        // --------------------------------
        // URL MANAGEMENT
        // --------------------------------
        
        // Update the URL with the current records
        function updateUrl() {
            // Get all recids
            const recids = Object.keys(recidData);
            
            // Create a new URL object
            const url = new URL(window.location.href);
            
            // Update or remove the recids parameter
            if (recids.length > 0) {
                // Use dash (-) as separator for cleaner URL
                url.searchParams.set('recids', recids.join('-'));
                
                // Add align parameter if checked
                const alignCheckbox = document.getElementById('align-timeline');
                if (alignCheckbox.checked) {
                    url.searchParams.set('align', 'true');
                } else {
                    url.searchParams.delete('align');
                }

                // Add rate parameters if the rate view is active
                if (document.getElementById('show-rate').checked) {
                    url.searchParams.set('rate', 'true');
                    const binValue = document.getElementById('bin-width').value;
                    if (binValue) {
                        url.searchParams.set('bin', binValue);
                    } else {
                        url.searchParams.delete('bin');
                    }
                    // Smooth is the default; only record opting out
                    if (!document.getElementById('smooth-rate').checked) {
                        url.searchParams.set('smooth', 'false');
                    } else {
                        url.searchParams.delete('smooth');
                    }
                } else {
                    url.searchParams.delete('rate');
                    url.searchParams.delete('bin');
                    url.searchParams.delete('smooth');
                }
            } else {
                // Remove all parameters if no records
                url.searchParams.delete('recids');
                url.searchParams.delete('align');
                url.searchParams.delete('rate');
                url.searchParams.delete('bin');
                url.searchParams.delete('smooth');
            }
            
            // Update the URL without reloading the page
            window.history.pushState({}, '', url);
        }
        
        // --------------------------------
        // RECORD IDENTIFIER PARSING
        // --------------------------------

        // Classify user input as an INSPIRE record id, arXiv id, or DOI.
        // Accepts bare identifiers, arXiv:/doi: prefixes, and inspirehep.net,
        // arxiv.org, and doi.org URLs. Returns {type, value} or null.
        function parseRecordIdentifier(input) {
            let value = (input || '').trim();
            if (!value) return null;

            // INSPIRE literature URL or bare record id
            let m = value.match(/inspirehep\.net\/(?:api\/)?literature\/(\d+)/i);
            if (m) return { type: 'recid', value: m[1] };
            if (/^\d+$/.test(value)) return { type: 'recid', value: value };

            // arXiv: URLs, optional prefix, new-style (2208.06843) and
            // old-style (hep-ph/9803241, cond-mat.str-el/0407066) ids;
            // version suffixes are dropped
            m = value.match(/arxiv\.org\/(?:abs|pdf)\/(.+?)(?:\.pdf)?\/?$/i);
            if (m) value = m[1];
            value = value.replace(/^arxiv:\s*/i, '');
            m = value.match(/^(\d{4}\.\d{4,5})(v\d+)?$/);
            if (m) return { type: 'arxiv', value: m[1] };
            m = value.match(/^([a-z-]+(?:\.[A-Za-z-]+)?\/\d{7})(v\d+)?$/);
            if (m) return { type: 'arxiv', value: m[1] };

            // DOI: doi.org URLs, doi: prefix, bare 10.xxxx/yyyy
            m = value.match(/(?:doi\.org\/|^doi:\s*)(10\.\d{4,9}\/\S+)$/i);
            if (m) return { type: 'doi', value: m[1] };
            m = value.match(/^(10\.\d{4,9}\/\S+)$/);
            if (m) return { type: 'doi', value: m[1] };

            return null;
        }

        // Resolve an arXiv id or DOI to an INSPIRE record id via the
        // single-record API endpoints (api/arxiv/<id>, api/doi/<doi>)
        async function resolveIdentifierToRecid(parsed) {
            const endpoint = parsed.type === 'arxiv' ? 'arxiv' : 'doi';
            const url = `https://inspirehep.net/api/${endpoint}/` +
                (parsed.type === 'doi' ? encodeURI(parsed.value) : parsed.value) +
                '?fields=control_number';
            const response = await inspireFetch(url);
            if (!response.ok) {
                throw new Error(response.status === 404 ? 'record not found' : `HTTP ${response.status}`);
            }
            const data = await response.json();
            const recid = parseInt((data.metadata && data.metadata.control_number) || data.id);
            if (!recid) {
                throw new Error('no record id in the API response');
            }
            return recid;
        }

        // --------------------------------
        // INSPIRE API ACCESS
        // --------------------------------
        // INSPIRE enforces 15 requests per 5-second window. All API calls go
        // through inspireFetch, which paces concurrent record loads through a
        // shared rolling window and retries on 429/5xx with backoff.

        const INSPIRE_RATE_WINDOW_MS = 5000;
        const INSPIRE_RATE_MAX_REQUESTS = 12; // stay below the 15/5s limit
        const inspireRequestTimes = [];

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Wait for a free request slot in the rolling rate-limit window
        async function inspireThrottle() {
            for (;;) {
                const now = Date.now();
                while (inspireRequestTimes.length > 0 &&
                       now - inspireRequestTimes[0] > INSPIRE_RATE_WINDOW_MS) {
                    inspireRequestTimes.shift();
                }
                if (inspireRequestTimes.length < INSPIRE_RATE_MAX_REQUESTS) {
                    inspireRequestTimes.push(now);
                    return;
                }
                await sleep(inspireRequestTimes[0] + INSPIRE_RATE_WINDOW_MS - now + 50);
            }
        }

        // Delay before retry attempt (0-based): honor a sane numeric
        // Retry-After header, else exponential 2s/4s/8s/... capped at 30s
        function computeBackoffDelayMs(attempt, retryAfterHeader) {
            const retryAfter = parseInt(retryAfterHeader);
            if (retryAfter > 0 && retryAfter <= 120) {
                return retryAfter * 1000;
            }
            return Math.min(2000 * Math.pow(2, attempt), 30000);
        }

        // fetch() with rate-limit pacing and automatic retries on 429/5xx
        // and network errors; other statuses are returned to the caller
        async function inspireFetch(url, maxRetries = 4) {
            for (let attempt = 0; ; attempt++) {
                await inspireThrottle();
                let response = null;
                try {
                    response = await fetch(url, {
                        headers: { "Accept": "application/json" }
                    });
                } catch (networkError) {
                    if (attempt >= maxRetries) throw networkError;
                }
                if (response) {
                    const retryable = response.status === 429 || response.status >= 500;
                    if (!retryable || attempt >= maxRetries) {
                        return response;
                    }
                }
                const delay = computeBackoffDelayMs(attempt,
                    response ? response.headers.get('Retry-After') : null);
                logDebug(`INSPIRE API ${response ? 'HTTP ' + response.status : 'network error'}, retrying in ${delay / 1000}s`);
                await sleep(delay);
            }
        }

        // --------------------------------
        // CITATION CACHE
        // --------------------------------
        // Fetched citation records are cached in localStorage for a day:
        // a fresh entry skips the API entirely, a stale one renders
        // immediately and is refreshed in the background. All storage
        // access degrades silently when localStorage is unavailable.

        const CACHE_PREFIX = 'inspire-citation-cache-v1:';
        const CACHE_TTL_MS = 24 * 60 * 60 * 1000;
        const CACHE_MAX_ENTRIES = 50;

        function safeLocalStorage() {
            try {
                if (typeof localStorage === 'undefined' || !localStorage) return null;
                const probe = CACHE_PREFIX + '__probe__';
                localStorage.setItem(probe, '1');
                localStorage.removeItem(probe);
                return localStorage;
            } catch (e) {
                return null;
            }
        }

        function cacheKeys(storage) {
            const keys = [];
            for (let i = 0; i < storage.length; i++) {
                const key = storage.key(i);
                if (key && key.indexOf(CACHE_PREFIX) === 0) keys.push(key);
            }
            return keys;
        }

        // Returns {record, fresh} or null; removes corrupt entries
        function cacheLoad(storage, recid, nowMs) {
            const key = CACHE_PREFIX + recid;
            try {
                const raw = storage.getItem(key);
                if (!raw) return null;
                const entry = JSON.parse(raw);
                if (!entry || !entry.record || !Array.isArray(entry.record.citation_dates)) {
                    storage.removeItem(key);
                    return null;
                }
                const age = (nowMs || Date.now()) - (entry.savedAt || 0);
                return { record: entry.record, fresh: age >= 0 && age < CACHE_TTL_MS };
            } catch (e) {
                try { storage.removeItem(key); } catch (e2) { /* ignore */ }
                return null;
            }
        }

        function cacheEvictOldest(storage, count) {
            const entries = cacheKeys(storage).map(key => {
                let savedAt = 0;
                try { savedAt = (JSON.parse(storage.getItem(key)) || {}).savedAt || 0; } catch (e) { /* evict first */ }
                return { key: key, savedAt: savedAt };
            }).sort((a, b) => a.savedAt - b.savedAt);
            for (let i = 0; i < Math.min(count, entries.length); i++) {
                try { storage.removeItem(entries[i].key); } catch (e) { /* ignore */ }
            }
        }

        function cacheSave(storage, recid, record, nowMs) {
            const key = CACHE_PREFIX + recid;
            const payload = JSON.stringify({ savedAt: nowMs || Date.now(), record: record });
            for (let attempt = 0; attempt < 4; attempt++) {
                try {
                    storage.setItem(key, payload);
                    break;
                } catch (e) {
                    // Quota exceeded: evict the oldest quarter and retry;
                    // give up quietly if nothing can be evicted
                    const before = cacheKeys(storage).length;
                    cacheEvictOldest(storage, Math.max(1, Math.ceil(before / 4)));
                    if (cacheKeys(storage).length === before) return;
                }
            }
            const excess = cacheKeys(storage).length - CACHE_MAX_ENTRIES;
            if (excess > 0) cacheEvictOldest(storage, excess);
        }

        // Cache-aware wrapper around citations_for_plot
        const cacheRevalidating = new Set();

        async function citations_for_plot_cached(recid, progressCallback) {
            const storage = safeLocalStorage();
            const cached = storage ? cacheLoad(storage, recid) : null;
            if (cached) {
                logDebug(`Cache ${cached.fresh ? 'hit' : 'hit (stale, refreshing)'} for recid ${recid}`);
                if (progressCallback) {
                    const n = cached.record.citation_dates.length;
                    progressCallback(n, n);
                }
                if (!cached.fresh) {
                    revalidateCachedRecord(recid);
                }
                return [cached.record];
            }
            const result = await citations_for_plot(recid, progressCallback);
            if (result.length > 0 && storage) {
                cacheSave(storage, recid, result[0]);
            }
            return result;
        }

        // Refetch a stale record in the background; update the cache, the
        // chart, and the record tag if the paper is still on display
        function revalidateCachedRecord(recid) {
            if (cacheRevalidating.has(recid)) return;
            cacheRevalidating.add(recid);
            (async () => {
                try {
                    const result = await citations_for_plot(recid, null);
                    if (result.length === 0) return;
                    const storage = safeLocalStorage();
                    if (storage) {
                        cacheSave(storage, recid, result[0]);
                    }
                    if (recidData[recid] && recidData[recid].citation_record) {
                        recidData[recid].citation_record = result[0];
                        updateChart();
                        const closeButton = document.querySelector(`.repo-tag .close[data-recid="${recid}"]`);
                        if (closeButton && closeButton.parentElement) {
                            closeButton.parentElement.innerHTML = `
                                <span class="repo-tag-content" onclick="window.open('https://inspirehep.net/literature/${recid}', '_blank')">${result[0].refname || `recid:${recid}`}</span>
                                <span class="close" data-recid="${recid}">×</span>
                            `;
                        }
                    }
                } catch (error) {
                    console.error(`Background refresh failed for recid ${recid}:`, error);
                } finally {
                    cacheRevalidating.delete(recid);
                }
            })();
        }

        // --------------------------------
        // FETCHING CITATION DATES
        // --------------------------------

        // Helper function to get record information from INSPIRE-HEP API.
        // Only the metadata fields used for the reference string are requested.
        async function get_recid_info(recid) {
            try {
                const url = `https://inspirehep.net/api/literature/${recid}` +
                    `?fields=titles,authors,publication_info,collaborations,arxiv_eprints,preprint_date`;
                const response = await inspireFetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch record info: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`Error fetching data from INSPIRE-HEP API: ${error}`);
                return null;
            }
        }
        
        // Format author names and create citation string
        async function get_recid_string(recid) {
            const recid_info = await get_recid_info(recid);
            if (!recid_info) {
                return ["Unknown", ""];
            }
            
            const metadata = recid_info.metadata || {};
            const authors = metadata.authors || [];
            const title = metadata.titles && metadata.titles.length > 0 ? metadata.titles[0].title : "";
            
            // Find the first publication_info entry that contains journal information
            let journal_info = {};
            if (metadata.publication_info && metadata.publication_info.length > 0) {
                // Iterate through all publication_info entries
                for (const info of metadata.publication_info) {
                    // If this entry has journal_title, use it
                    if (info.journal_title) {
                        journal_info = info;
                        break;
                    }
                }
                
                // If no entry with journal_title was found, fall back to the first entry
                if (Object.keys(journal_info).length === 0 && metadata.publication_info.length > 0) {
                    journal_info = metadata.publication_info[0];
                }
            }
            
            const journal = journal_info.journal_title || "";
            const volume = journal_info.journal_volume || "";
            const page = journal_info.artid || journal_info.page_start || "";
            const year = journal_info.year || "";
            var collaboration = "";
            if (metadata.collaborations && metadata.collaborations.length > 0) {
                collaboration = metadata.collaborations[0].value || "";
            }
            
            // Format the author names
            let author_names = [];
            for (const author of authors) {
                const full_name = author.full_name ? author.full_name.split(", ")[0] : "";
                if (full_name) {
                    author_names.push(full_name);
                }
            }
            
            // Format author string
            let author_str;
            if (collaboration.length > 0) {
                author_str = collaboration + " Collaboration";
            } else if (author_names.length > 1) {
                author_str = author_names[0] + " et al.";
            } else if (author_names.length === 1) {
                author_str = author_names[0];
            } else {
                author_str = "Unknown Author";
            }
            
            // Format the citation string
            let citation_str;
            if (journal) {
                citation_str = `${author_str}, ${journal} ${volume}, ${page} (${year})`;
            } else {
                const eprint = metadata.arxiv_eprints && metadata.arxiv_eprints.length > 0 ? metadata.arxiv_eprints[0].value : "";
                if (eprint) {
                    let eprint_year = metadata.preprint_date || "";
                    if (eprint_year.length !== 4) {
                        eprint_year = eprint_year.substring(0, 4);
                    }
                    citation_str = `${author_str}, ${eprint}`;
                } else {
                    let created_year = recid_info.created || "";
                    if (created_year.length !== 4) {
                        created_year = created_year.substring(0, 4);
                    }
                    citation_str = `${author_str}, (${created_year})`;
                }
            }
            
            const created_date = recid_info.created || "";
            const preprint_date = (recid_info.metadata || {}).preprint_date || "";
            const date = preprint_date ? (created_date < preprint_date ? created_date : preprint_date) : created_date;
            return [citation_str, date];
        }
        
        // Get citations for a given record ID
        async function get_citations_by_recid(recid, size = 500, page = 1) {
            try {
                // Only the citation dates are needed downstream, so request
                // just earliest_date: responses shrink by orders of magnitude
                const url = `https://inspirehep.net/api/literature?q=refersto:recid:${recid}` +
                    `&size=${size}&page=${page}&fields=earliest_date`;
                const response = await inspireFetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch citations: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`Error fetching citations from INSPIRE-HEP API: ${error}`);
                return null;
            }
        }
        
        // Parse citation data from API response
        function parse_citation_data(citation_data) {
            if (!citation_data || !citation_data.hits) {
                return [];
            }
            
            const citations = [];
            for (const hit of citation_data.hits.hits) {
                const metadata = hit.metadata || {};
                const citation_info = {
                    recid: hit.id,
                    title: metadata.titles && metadata.titles.length > 0 ? metadata.titles[0].title : "",
                    date: metadata.earliest_date || "",
                    authors: (metadata.authors || []).map(author => author.full_name || ""),
                    author_count: (metadata.authors || []).length,
                    journal: metadata.publication_info && metadata.publication_info.length > 0 ? metadata.publication_info[0].journal_title || "" : "",
                    volume: metadata.publication_info && metadata.publication_info.length > 0 ? metadata.publication_info[0].journal_volume || "" : "",
                    page: metadata.publication_info && metadata.publication_info.length > 0 ? metadata.publication_info[0].page_start || "" : "",
                    doi: metadata.doi || "",
                    citations_count: metadata.citation_count || 0
                };
                
                const created_date = hit.created || "";
                
                // If earliest_date has only year and no month or day, use the created date
                if (citation_info.date.length === 4 && created_date.substring(0, 4) <= citation_info.date) {
                    citation_info.date = created_date.substring(0, 10);
                }
                
                // If the date has only year, add month and day
                if (citation_info.date.length === 4) {
                    citation_info.date = `${citation_info.date}-01-01`;
                }
                
                citations.push(citation_info);
            }
            
            return citations;
        }
        
        // Get citation data for plotting
        async function citations_for_plot(recid, progressCallback) {
            try {
                let allCitations = [];
                let page = 1;
                const pageSize = 500; // API maximum is 1000; slimmed responses make larger pages cheap
                let totalRecords = 0;
                let processedRecords = 0;
                let hasMorePages = true;
                
                // First request to get total count and first batch
                const firstPageData = await get_citations_by_recid(recid, pageSize, page);
                if (!firstPageData) {
                    return [];
                }
                
                // Get total number of citations
                totalRecords = firstPageData.hits.total;
                
                // Process first page
                const firstPageCitations = parse_citation_data(firstPageData);
                allCitations = [...allCitations, ...firstPageCitations];
                processedRecords += firstPageCitations.length;
                
                // Update progress if callback provided
                if (progressCallback) {
                    progressCallback(processedRecords, totalRecords);
                }
                
                // Get remaining pages if needed
                page++;
                while (processedRecords < totalRecords) {
                    const nextPageData = await get_citations_by_recid(recid, pageSize, page);
                    if (!nextPageData || !nextPageData.hits || !nextPageData.hits.hits || nextPageData.hits.hits.length === 0) {
                        break; // No more results or error
                    }
                    
                    const pageCitations = parse_citation_data(nextPageData);
                    allCitations = [...allCitations, ...pageCitations];
                    processedRecords += pageCitations.length;
                    
                    // Update progress if callback provided
                    if (progressCallback) {
                        progressCallback(processedRecords, totalRecords);
                    }
                    
                    page++;
                }
                
                // Get record info for formatting
                const recid_info = await get_recid_string(recid);
                
                // Extract dates from all citations
                const dates_only = allCitations.map(citation => citation.date || "");
                
                return [{
                    recid: recid,
                    date: recid_info[1],
                    refname: recid_info[0],
                    citation_dates: dates_only,
                    total_citations: totalRecords
                }];
            } catch (error) {
                console.error(`Failed to retrieve citation data for recid: ${recid}`, error);
                return [];
            }
        }

        // --------------------------------
        // PROCESS CITATION DATA
        // --------------------------------
        // Turn an array of raw date strings into a monthly cumulative time series
        function processCitationData(res, Mode) {
            if (!res) {
                return [];
            }
            const dates = res.citation_dates;
            if (!dates || dates.length === 0) {
                return [];
            }
            
            // Sort the date strings
            dates.sort();

            // We'll accumulate citations month by month from the earliest citation up to now
            const currentDate = new Date(res.date);
            
            // Loop over all dates and accumulate
            
            var cumulativeCount = 0;
            var dataPoints = [];

            // If paper date is before first citation, add it
            // if (currentDate < new Date(dates[0])) {
                dataPoints.push({
                    x: Mode !== 0 ? 0 : currentDate,
                    y: cumulativeCount
                });
            // }

            var maxNumberOfPoints = 20;
            var diff = dates.length / maxNumberOfPoints;
            if (diff < 1) {
                diff = 1;
            }
            var monthsNorm = 1000 * 60 * 60 * 24 * 365.25 / 12;
            var yearsNorm = 1000 * 60 * 60 * 24 * 365.25;

            var useYears = (Mode === 2);

            var nextGoal = cumulativeCount + diff;
            
            for (let i = 0; i < dates.length; i++) {
                var date = new Date(dates[i]);
                if (date < currentDate)
                    date = currentDate;

                cumulativeCount++;
                
                if (cumulativeCount >= nextGoal) {
                    nextGoal += diff;
                    
                    // Add the date to the data points
                    dataPoints.push({
                        x: Mode !== 0 ? (Mode === 2 ? Number(((date - currentDate) / yearsNorm).toFixed(2)): Number(((date - currentDate) / monthsNorm).toFixed(1))) : date,
                        y: cumulativeCount
                    });
                }
            }

            // Add today
            const today = new Date();
            dataPoints.push({
                x: Mode !== 0 ? (Mode === 2 ? Number(((today - currentDate) / yearsNorm).toFixed(2)) : Number(((today - currentDate) / monthsNorm).toFixed(1))) : today,
                y: cumulativeCount
            });
            
            return dataPoints;
        }
        
        // --------------------------------
        // CITATION RATE ESTIMATION
        // --------------------------------
        // The citation stream is modeled as an inhomogeneous Poisson process.
        // The rate is estimated as a piecewise-constant MLE (binned counts / bin width)
        // with 68% central Poisson intervals per bin.

        const MS_PER_MONTH = 1000 * 60 * 60 * 24 * 365.25 / 12;

        // 68% central Poisson interval for a count n (may be fractional, for
        // the smooth estimator's effective counts), via the Wilson-Hilferty
        // approximation to the exact (Garwood) chi-squared interval.
        function poissonInterval68(n) {
            const z = 1.0; // 68.27% central interval
            const lo = n <= 0 ? 0 :
                Math.max(0, n * Math.pow(1 - 1 / (9 * n) - z / (3 * Math.sqrt(n)), 3));
            const hi = (n + 1) * Math.pow(1 - 1 / (9 * (n + 1)) + z / (3 * Math.sqrt(n + 1)), 3);
            return [lo, hi];
        }

        // Error function (Abramowitz & Stegun 7.1.26, |error| < 1.5e-7)
        function erf(x) {
            const sign = x < 0 ? -1 : 1;
            const ax = Math.abs(x);
            const t = 1 / (1 + 0.3275911 * ax);
            const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
                - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
            return sign * y;
        }

        function normCdf(x) {
            return 0.5 * (1 + erf(x / Math.SQRT2));
        }

        // Publication date, months of history, and citation month-offsets
        // (clamped to [0, spanMonths]); null if the record has no history yet.
        function getCitationOffsets(record, nowMs) {
            const pubDate = new Date(record.date);
            const now = nowMs ? new Date(nowMs) : new Date();
            const spanMonths = (now - pubDate) / MS_PER_MONTH;
            if (!(spanMonths > 0)) return null;
            const offsets = [];
            for (const dateStr of (record.citation_dates || [])) {
                const d = new Date(dateStr);
                if (isNaN(d)) continue;
                let m = (d - pubDate) / MS_PER_MONTH;
                if (m < 0) m = 0;
                if (m > spanMonths) m = spanMonths;
                offsets.push(m);
            }
            return { pubDate: pubDate, spanMonths: spanMonths, offsets: offsets };
        }

        // x coordinate for a point midMonths after publication, per axis mode
        function rateXValue(pubDate, midMonths, Mode) {
            return Mode !== 0 ?
                (Mode === 2 ? Number((midMonths / 12).toFixed(3)) : Number(midMonths.toFixed(2))) :
                new Date(pubDate.getTime() + midMonths * MS_PER_MONTH);
        }

        // Pick a bin width (in average months): the finest of 1/2/3/6/12/24 months
        // that keeps the plot readable (<= 100 bins) with >= 8 citations per bin
        // on average, so relative errors stay below ~35%.
        function chooseBinWidthMonths(nCitations, spanMonths) {
            const candidates = [1, 2, 3, 6, 12, 24];
            for (const c of candidates) {
                const nBins = Math.max(1, Math.ceil(spanMonths / c));
                if (nBins <= 100 && nCitations / nBins >= 8) {
                    return c;
                }
            }
            return candidates[candidates.length - 1];
        }

        // Bin citation dates into a piecewise-constant rate estimate.
        // Returns points with x (Date in Mode 0, months since publication in
        // Mode 1, years in Mode 2), y/lo/hi in citations per year, the bin
        // count n, and a partial flag on the current (incomplete) bin.
        function computeRateSeries(record, Mode, binMonthsOverride, nowMs) {
            const base = getCitationOffsets(record, nowMs);
            if (!base) {
                return { points: [], binMonths: 1 };
            }
            const pubDate = base.pubDate;
            const spanMonths = base.spanMonths;
            const offsets = base.offsets;

            const binMonths = binMonthsOverride > 0 ? binMonthsOverride :
                chooseBinWidthMonths(offsets.length, spanMonths);
            const nBins = Math.max(1, Math.ceil(spanMonths / binMonths));
            const counts = new Array(nBins).fill(0);
            for (const m of offsets) {
                let idx = Math.floor(m / binMonths);
                if (idx >= nBins) idx = nBins - 1;
                counts[idx]++;
            }

            const points = [];
            for (let k = 0; k < nBins; k++) {
                const start = k * binMonths;
                const end = Math.min((k + 1) * binMonths, spanMonths);
                const width = end - start; // last bin normalized by elapsed width
                if (width <= 0) continue;
                const mid = (start + end) / 2;
                const n = counts[k];
                const interval = poissonInterval68(n);
                // width is in months; displayed unit is citations per year
                points.push({
                    x: rateXValue(pubDate, mid, Mode),
                    y: 12 * n / width,
                    lo: 12 * interval[0] / width,
                    hi: 12 * interval[1] / width,
                    n: n,
                    partial: k === nBins - 1 // current bin: still filling + indexing lag
                });
            }
            return { points: points, binMonths: binMonths };
        }

        // Smooth rate estimate: Gaussian-kernel intensity estimator with
        // cut-and-normalize boundary correction,
        //   lambda(t) = sum_i K_h(t - t_i) / m(t),   m(t) = int_0^T K_h(t - u) du.
        // For a Poisson process Var(lambda) = lambda * int K^2 / m^2 (Campbell's
        // theorem), i.e. lambda behaves like a Poisson count over an effective
        // exposure E0(t) = m(t)^2 / int_0^T K_h(t-u)^2 du months. The band maps
        // n_eff = lambda * E0 through the same 68% Poisson interval as the bins,
        // which stays positive and asymmetric at low rates and widens by ~sqrt(2)
        // at the window edges.
        function computeSmoothRateSeries(record, Mode, fwhmOverride, nowMs) {
            const base = getCitationOffsets(record, nowMs);
            if (!base) {
                return { points: [], widthMonths: 6 };
            }
            const pubDate = base.pubDate;
            const T = base.spanMonths;
            const offsets = base.offsets;

            // Smoothing scale expressed as a FWHM, comparable to a bin width;
            // auto: twice the auto bin width, at least half a year.
            const autoBin = chooseBinWidthMonths(offsets.length, T);
            const fwhm = fwhmOverride > 0 ? fwhmOverride : Math.max(2 * autoBin, 6);
            const h = fwhm / 2.3548; // Gaussian sigma in months

            const nGrid = Math.max(120, Math.min(400, Math.ceil((T / h) * 4)));
            const norm = 1 / (h * Math.sqrt(2 * Math.PI));
            const points = [];
            for (let g = 0; g <= nGrid; g++) {
                const t = T * g / nGrid;
                const mass = normCdf((T - t) / h) - normCdf(-t / h);
                if (mass <= 1e-12) continue;
                const kernelSqInt = (normCdf(Math.SQRT2 * (T - t) / h) - normCdf(-Math.SQRT2 * t / h)) /
                    (2 * h * Math.sqrt(Math.PI));
                let sum = 0;
                for (const m of offsets) {
                    const u = (t - m) / h;
                    if (u < -6 || u > 6) continue;
                    sum += norm * Math.exp(-0.5 * u * u);
                }
                const rate = sum / mass; // per month internally
                const exposure = mass * mass / kernelSqInt; // effective months
                const nEff = rate * exposure;
                const interval = poissonInterval68(nEff);
                // displayed unit is citations per year
                points.push({
                    x: rateXValue(pubDate, t, Mode),
                    y: 12 * rate,
                    lo: 12 * interval[0] / exposure,
                    hi: 12 * interval[1] / exposure,
                    n: Math.round(nEff * 10) / 10,
                    partial: t > T - h, // within one sigma of now: indexing lag
                    smooth: true
                });
            }
            return { points: points, widthMonths: fwhm };
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Present-rate annotation: a small "value ± err" label in the series
        // color, in the right margin next to each curve's latest point.
        const presentRateLabelPlugin = {
            id: 'presentRateLabel',
            afterDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const annos = [];
                chart.data.datasets.forEach((ds, i) => {
                    if (!ds.label || ds.label.startsWith('__')) return;
                    if (!chart.isDatasetVisible(i)) return;
                    const data = ds.data;
                    if (!data || data.length === 0) return;
                    const p = data[data.length - 1];
                    const err = (p.hi - p.lo) / 2;
                    const dec = p.y < 10 ? 1 : 0;
                    annos.push({
                        text: `${p.y.toFixed(dec)} ± ${err.toFixed(dec)}`,
                        color: ds.borderColor,
                        y: chart.scales.y.getPixelForValue(p.y)
                    });
                });
                if (annos.length === 0) return;
                // keep labels inside the plot vertically, without overlaps
                const top = chart.chartArea.top + 6;
                const bottom = chart.chartArea.bottom - 6;
                annos.sort((a, b) => a.y - b.y);
                annos.forEach(a => { a.y = Math.min(Math.max(a.y, top), bottom); });
                for (let i = 1; i < annos.length; i++) {
                    if (annos[i].y - annos[i - 1].y < 13) {
                        annos[i].y = annos[i - 1].y + 13;
                    }
                }
                ctx.save();
                ctx.font = '11px "Comic Sans MS", "Comic Sans", cursive';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                annos.forEach(a => {
                    ctx.fillStyle = a.color;
                    ctx.fillText(a.text, chart.chartArea.right + 6, a.y);
                });
                ctx.restore();
            }
        };

        // Render the citation-rate view (binned Poisson rate with 68% bands)
        // using Chart.js, which supports shaded bands and a native time axis.
        function renderRateChart(Mode) {
            const rateCanvas = document.getElementById('rate-chart');
            if (!window.Chart) {
                alert('Chart.js failed to load; the citation rate view is unavailable.');
                return;
            }

            const binOverride = parseInt(document.getElementById('bin-width').value) || 0;
            const smoothRate = document.getElementById('smooth-rate').checked;
            Chart.defaults.font.family = '"Comic Sans MS", "Comic Sans", cursive';

            const datasets = [];
            rateData = [];
            let colorIndex = 0;
            Object.entries(recidData).forEach(([recid, data]) => {
                const record = data.citation_record;
                if (!record || !record.refname || !record.date) {
                    console.error(`Missing or invalid citation_record for recid ${recid}`);
                    return;
                }

                const series = smoothRate ?
                    computeSmoothRateSeries(record, Mode, binOverride) :
                    computeRateSeries(record, Mode, binOverride);
                if (series.points.length === 0) return;

                const color = COLORS[colorIndex % COLORS.length];
                colorIndex++;
                const points = series.points;
                const stepStyle = smoothRate ? false : 'middle';
                rateData.push({
                    recid: recid,
                    label: record.refname,
                    estimator: smoothRate ? 'smooth' : 'binned',
                    widthMonths: smoothRate ? series.widthMonths : series.binMonths,
                    points: points
                });

                // Central estimate; the provisional part near the present
                // (incomplete current bin / last sigma) is drawn dashed.
                datasets.push({
                    label: record.refname,
                    data: points,
                    borderColor: color,
                    backgroundColor: color,
                    stepped: stepStyle,
                    tension: 0,
                    borderWidth: 2.5,
                    pointRadius: smoothRate ? 0 : 2.5,
                    pointHoverRadius: smoothRate ? 3 : 4,
                    pointHitRadius: smoothRate ? 6 : 10,
                    pointBackgroundColor: (ctx) =>
                        points[ctx.dataIndex] && points[ctx.dataIndex].partial ? '#ffffff' : color,
                    segment: {
                        borderDash: (ctx) =>
                            points[ctx.p1DataIndex] && points[ctx.p1DataIndex].partial ? [6, 4] : undefined
                    }
                });
                // 68% band: invisible upper edge, lower edge filled up to it.
                datasets.push({
                    label: '__band_hi_' + recid,
                    data: points.map(p => ({ x: p.x, y: p.hi })),
                    borderWidth: 0,
                    pointRadius: 0,
                    pointHitRadius: 0,
                    stepped: stepStyle,
                    tension: 0,
                    backgroundColor: 'transparent'
                });
                datasets.push({
                    label: '__band_lo_' + recid,
                    data: points.map(p => ({ x: p.x, y: p.lo })),
                    borderWidth: 0,
                    pointRadius: 0,
                    pointHitRadius: 0,
                    stepped: stepStyle,
                    tension: 0,
                    fill: '-1',
                    backgroundColor: hexToRgba(color, 0.18)
                });
            });

            const xScale = Mode !== 0 ? {
                type: 'linear',
                beginAtZero: true,
                title: {
                    display: true,
                    text: Mode === 2 ? 'Years since publication' : 'Months since publication'
                }
            } : {
                type: 'time',
                time: { tooltipFormat: 'MMM d, yyyy' },
                title: { display: true, text: 'Date' }
            };

            rateChart = new Chart(rateCanvas, {
                type: 'line',
                data: { datasets: datasets },
                plugins: [presentRateLabelPlugin],
                options: {
                    responsive: true,
                    devicePixelRatio: 2,
                    animation: false,
                    layout: { padding: { right: 84 } },
                    interaction: { mode: 'nearest', intersect: true },
                    plugins: {
                        title: { display: true, text: 'Citation Rate', font: { size: 20 } },
                        legend: {
                            labels: { filter: (item) => !item.text.startsWith('__') },
                            // Toggle a paper together with its band datasets
                            onClick: (e, legendItem, legend) => {
                                const ci = legend.chart;
                                const idx = legendItem.datasetIndex;
                                const visible = ci.isDatasetVisible(idx);
                                for (let j = idx; j < Math.min(idx + 3, ci.data.datasets.length); j++) {
                                    ci.setDatasetVisibility(j, !visible);
                                }
                                ci.update();
                            }
                        },
                        tooltip: {
                            filter: (item) => !item.dataset.label.startsWith('__'),
                            callbacks: {
                                label: (ctx) => {
                                    const p = ctx.raw;
                                    const up = p.hi - p.y;
                                    const dn = p.y - p.lo;
                                    if (!(up > 0 || dn > 0)) return p.y.toFixed(1);
                                    if (Math.abs(up - dn) < 0.15 * Math.max(up, dn)) {
                                        return `${p.y.toFixed(1)} ± ${((up + dn) / 2).toFixed(1)}`;
                                    }
                                    return `${p.y.toFixed(1)} +${up.toFixed(1)} -${dn.toFixed(1)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: xScale,
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Citations per year' }
                        }
                    }
                }
            });
        }

                return;

                recid = parseInt(parsed.value);
            } else {
                // Resolve arXiv/DOI to an INSPIRE record id first
                loadingElement.textContent =
                    `Resolving ${parsed.type === 'arxiv' ? 'arXiv:' : 'DOI '}${parsed.value}...`;
                loadingElement.style.display = 'block';
                disableButtons();
                try {
                    recid = await resolveIdentifierToRecid(parsed);
                } catch (error) {
                    alert(`Could not resolve "${rawValue}" on INSPIRE: ${error.message}`);
                    loadingElement.style.display = 'none';
                    enableButtons();
                    return;

                loadingElement.textContent = 'Loading citation data...';

                alert('This record is already in the list');
                loadingElement.style.display = 'none';
                enableButtons();

            // Add to the list
            recidData[recid] = {

                    recidData[recid].citation_record = data;

                    // Remove from UI & data
                    const recidTags = document.querySelectorAll(`.repo-tag[data-recid="${recid}"], .repo-tag .close[data-recid="${recid}"]`);

        // Parse URL parameters and add records automatically
        async function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const recidsParam = urlParams.get('recids');
            const alignParam = urlParams.get('align');
            
            // Handle the align parameter
            if (alignParam !== null) {
                const alignCheckbox = document.getElementById('align-timeline');
                alignCheckbox.checked = alignParam.toLowerCase() === 'true';
            }

            // Handle the rate-view parameters
            const rateParam = urlParams.get('rate');
            if (rateParam !== null) {
                document.getElementById('show-rate').checked = rateParam.toLowerCase() === 'true';
            }
            const binParam = parseInt(urlParams.get('bin'));
            if ([1, 3, 6, 12].includes(binParam)) {
                document.getElementById('bin-width').value = String(binParam);
            }
            const smoothParam = urlParams.get('smooth');
            if (smoothParam !== null) {
                document.getElementById('smooth-rate').checked = smoothParam.toLowerCase() !== 'false';
            }
            
            if (recidsParam) {
                // Split by dash (-) character
                const recids = recidsParam.split('-');
                
                // Show loading indicator once for all recids
                const loadingElement = document.getElementById('loading');
                loadingElement.textContent = `Loading records...`;
                loadingElement.style.display = 'block';
                disableButtons();
                
                // Keep track of completed fetches and progress
                let completedFetches = 0;
                const progressMap = {};
                
                // Function to update the loading message with detailed progress
                function updateLoadingMessage() {
                    // Only include records that are still loading
                    const progressParts = Object.entries(progressMap)
                        .filter(([recid, progress]) => !progress.completed)
                        .map(([recid, progress]) => {
                            if (progress.total === 0) {
                                return `${recid}:loading`;
                            }
                            return `${recid}:${progress.loaded}/${progress.total}`;
                        });
                    
                    if (progressParts.length === 0) {
                        loadingElement.textContent = 'All records loaded!';
                    } else {
                        loadingElement.textContent = `Loading records... ${progressParts.join(', ')}`;
                    }
                }
                
                // Process all recids and create their UI elements first
                const validRecids = [];
                for (let i = 0; i < recids.length; i++) {
                    const recidStr = recids[i];
                    
                    // Clean up the recid
                    let recid = recidStr.trim();
                    
                    // Extract recid from URL if it's a URL
                    if (recid.includes('inspirehep.net/literature/')) {
                        const match = recid.match(/\/literature\/(\d+)/);
                        if (match && match[1]) {
                            recid = match[1];
                        }
                    }
                    
                    // Check if it's a valid number
                    if (/^\d+$/.test(recid)) {
                        // Add to the list if not already present
                        if (!recidData[recid]) {
                            validRecids.push(recid);
                            
                            // Initialize progress tracking
                            progressMap[recid] = { loaded: 0, total: 0, completed: false };
                            
                            // Add the recid to the data structure
                            const recidInt = parseInt(recid);
                            recidData[recid] = { citation_record: [] };
                            
                            // Create a tag for the recid
                            const recidList = document.getElementById('recid-list');
                            const recidTag = document.createElement('div');
                            recidTag.className = 'repo-tag';
                            recidTag.innerHTML = `
                                recid:${recid}
                                <span class="close" data-recid="${recid}">×</span>
                            `;
                            recidList.appendChild(recidTag);
                            
                            // Add event listener to the close button
                            const closeButton = recidTag.querySelector('.close');
                            closeButton.addEventListener('click', function() {
                                removeRecid(recid);
                            });
                        }
                    }
                }
                
                // Update loading message initially
                updateLoadingMessage();
                
                // If no valid recids, hide loading and return
                if (validRecids.length === 0) {
                    loadingElement.style.display = 'none';
                    enableButtons();
                    return;
                }
                
                // Create a mutex for chart updates to prevent race conditions
                const updateChartMutex = {
                    isUpdating: false,
                    queue: 0,
                    async update() {
                        if (this.isUpdating) {
                            this.queue++;
                            return;
                        }
                        
                        this.isUpdating = true;
                        try {
                            updateChart();
                        } finally {
                            this.isUpdating = false;
                            if (this.queue > 0) {
                                this.queue--;
                                setTimeout(() => this.update(), 50);
                            }
                        }
                    }
                };
                
                // Fetch all records in parallel
                const fetchPromises = validRecids.map(recid => {
                    return (async () => {
                        const recidInt = parseInt(recid);
                        try {
                            // Create progress callback for this recid
                            const progressCallback = (loaded, total) => {
                                progressMap[recid] = { loaded, total, completed: false };
                                updateLoadingMessage();
                            };
                            
                            // Fetch data for this recid
                            const data = await fetchCitationDatesWithoutLoadingUI(recidInt, progressCallback);
                            
                            // Update the data
                            recidData[recid].citation_record = data;
                            
                            // Update the tag with the proper name
                            const recidTag = document.querySelector(`.repo-tag .close[data-recid="${recid}"]`).parentElement;
                            recidTag.innerHTML = `
                                <span class="repo-tag-content" onclick="window.open('https://inspirehep.net/literature/${recid}', '_blank')">${data.refname || `recid:${recid}`}</span>
                                <span class="close" data-recid="${recid}">×</span>
                            `;
                            
                            // Add event listener to the close button again
                            const closeButton = recidTag.querySelector('.close');
                            closeButton.addEventListener('click', function() {
                                removeRecid(recid);
                            });
                            
                            // Update the chart after each successful fetch
                            await updateChartMutex.update();
                            
                            // Mark as completed and update loading message
                            progressMap[recid].completed = true;
                            updateLoadingMessage();
                            
                            // Update completed fetches count
                            completedFetches++;
                            
                            // If all fetches are complete, hide loading after a short delay
                            if (completedFetches === validRecids.length) {
                                setTimeout(() => {
                                    loadingElement.style.display = 'none';
                                    enableButtons();
                                }, 1000); // Show "All records loaded!" for 1 second
                            }
                            
                            return true;
                        } catch (error) {
                            console.error(`Failed to fetch citation data for recid ${recid}: ${error.message}`);
                            
                            // Mark as completed with error
                            progressMap[recid] = { loaded: 0, total: 0, error: true, completed: true };
                            updateLoadingMessage();
                            
                            // Update completed fetches count
                            completedFetches++;
                            
                            // If all fetches are complete, hide loading after a short delay
                            if (completedFetches === validRecids.length) {
                                setTimeout(() => {
                                    loadingElement.style.display = 'none';
                                    enableButtons();
                                }, 1000);
                            }
                            
                            return false;
                        }
                    })();
                });
                
                // Wait for all fetches to complete
                await Promise.all(fetchPromises);
                
                // Final chart update to ensure everything is displayed correctly
                updateChart();
            }
        }

        // Function to save chart as image
        function saveChartAsImage() {
            // Rate view renders to a canvas; composite it on white and download
            if (document.getElementById('show-rate').checked && rateChart) {
                const sourceCanvas = document.getElementById('rate-chart');
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = sourceCanvas.width;
                exportCanvas.height = sourceCanvas.height;
                const exportCtx = exportCanvas.getContext('2d');
                exportCtx.fillStyle = 'white';
                exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                exportCtx.drawImage(sourceCanvas, 0, 0);
                exportCanvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = 'citation-rate.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png', 1.0);
                return;
            }

            const svgElement = document.getElementById('chart');
            
            // Create a canvas element with higher resolution
            const canvas = document.createElement('canvas');
            const svgRect = svgElement.getBoundingClientRect();
            const scaleFactor = 2; // Increase resolution by 2x
            
            canvas.width = svgRect.width * scaleFactor;
            canvas.height = svgRect.height * scaleFactor;
            const ctx = canvas.getContext('2d');
            
            // Create an image from the SVG
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const img = new Image();
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                // Draw the image on the canvas with scaling for higher resolution
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scaleFactor, scaleFactor);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                
                // Convert canvas to blob and download
                canvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = 'citation-history.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png', 1.0); // Use maximum quality
            };
            
            img.src = url;
        }
        
        // Export the binned rate series (long format: one row per paper per bin)
        function exportRateCSV() {
            const escapeCSV = (text) => {
                let value = String(text);
                if (value.includes(',') || value.includes('"') || value.includes('\n')) {
                    value = '"' + value.replace(/"/g, '""') + '"';
                }
                return value;
            };

            // N is the bin count for the binned estimator and the effective
            // count n_eff for the smooth one; WidthMonths is the bin width or
            // the smoothing FWHM respectively.
            let csvContent = 'Paper,Estimator,WidthMonths,X,CitationsPerYear,ErrLow68,ErrHigh68,N,Provisional\n';
            rateData.forEach(series => {
                series.points.forEach(p => {
                    const xValue = p.x instanceof Date ? p.x.toISOString().split('T')[0] : p.x;
                    csvContent += [
                        escapeCSV(series.label),
                        series.estimator,
                        series.widthMonths,
                        xValue,
                        p.y.toFixed(4),
                        p.lo.toFixed(4),
                        p.hi.toFixed(4),
                        p.n,
                        p.partial ? 'yes' : 'no'
                    ].join(',') + '\n';
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'citation-rate.csv';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // Function to export data to CSV
        function exportDataToCSV() {
            // Get the data directly from recidData which contains all citation information
            if (Object.keys(recidData).length === 0) {
                alert('No data to export');
                return;
            }

            // Rate view exports the binned rate series instead
            if (document.getElementById('show-rate').checked && rateData && rateData.length > 0) {
                exportRateCSV();
                return;
            }
            
            // Create CSV content
            let csvContent = 'Date';
            
            // Add headers for each dataset
            const recids = Object.keys(recidData);
            recids.forEach(recid => {
                let headerText = recid;
                if (recidData[recid].citation_record && recidData[recid].citation_record.refname) {
                    headerText = recidData[recid].citation_record.refname;
                }
                
                // Properly escape the header text for CSV
                // If it contains commas, quotes, or newlines, wrap in quotes and escape any quotes
                if (headerText.includes(',') || headerText.includes('"') || headerText.includes('\n')) {
                    // Replace any quotes with double quotes (CSV escaping standard)
                    headerText = headerText.replace(/"/g, '""');
                    // Wrap in quotes
                    headerText = '"' + headerText + '"';
                }
                
                csvContent += ',' + headerText;
            });
            csvContent += '\n';
            
            // Collect all dates from all datasets
            const allDatesSet = new Set();
            recids.forEach(recid => {
                if (recidData[recid].citation_record && recidData[recid].citation_record.citation_dates) {
                    // Get publication date
                    if (recidData[recid].citation_record.date) {
                        allDatesSet.add(new Date(recidData[recid].citation_record.date));
                    }
                    
                    // Get all citation dates
                    recidData[recid].citation_record.citation_dates.forEach(dateStr => {
                        allDatesSet.add(new Date(dateStr));
                    });
                    
                    // Add today's date
                    allDatesSet.add(new Date());
                }
            });
            
            // Convert to array and sort chronologically
            const allDates = Array.from(allDatesSet).sort((a, b) => a - b);
            
            // For each date, calculate cumulative citations for each dataset
            allDates.forEach(date => {
                // Format date as YYYY-MM-DD
                const formattedDate = date.toISOString().split('T')[0];
                csvContent += formattedDate;
                
                // For each recid, count citations up to this date
                recids.forEach(recid => {
                    if (!recidData[recid].citation_record || !recidData[recid].citation_record.citation_dates) {
                        csvContent += ',';
                        return;
                    }
                    
                    // Get publication date
                    const pubDate = recidData[recid].citation_record.date ? 
                                   new Date(recidData[recid].citation_record.date) : null;
                    
                    // Skip if paper wasn't published yet at this date
                    if (pubDate && date < pubDate) {
                        csvContent += ',0';
                        return;
                    }
                    
                    // Count citations up to this date
                    let count = 0;
                    recidData[recid].citation_record.citation_dates.forEach(citeDateStr => {
                        const citeDate = new Date(citeDateStr);
                        if (citeDate <= date) {
                            count++;
                        }
                    });
                    
                    csvContent += ',' + count;
                });
                
                csvContent += '\n';
            });
            
            // Create and download the CSV file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'citation-history.csv';
            link.click();
            URL.revokeObjectURL(link.href);
        }
        
        // Function to copy the current URL to clipboard
        function copyLinkToClipboard() {
            // Get the current URL
            const currentUrl = window.location.href;
            
            // Use the Clipboard API to copy the URL
            navigator.clipboard.writeText(currentUrl)
                .then(() => {
                    // Show a temporary success message
                    const button = document.getElementById('copy-link');
                    const originalText = button.innerHTML;
                    
                    // Change button text to indicate success
                    button.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Copied!
                    `;
                    
                    // Reset button text after 2 seconds
                    setTimeout(() => {
                        button.innerHTML = originalText;
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy URL: ', err);
                    alert('Failed to copy URL to clipboard');
                });
        }
        
        // Email obfuscation function to prevent spam
        function openEmail() {
            // Construct the email address parts to avoid spam bots
            const user = 'vlvovch';
            const domain = 'gmail.com';
            
            // Create the mailto link dynamically
            const mailtoLink = 'mailto:' + user + '@' + domain;
            
            // Open the email client
            window.location.href = mailtoLink;
        }
        
        // Set up email tooltip on document load
        document.addEventListener('DOMContentLoaded', function() {
            const emailLink = document.getElementById('email-link');
            
            // Show email on mouseover
            emailLink.addEventListener('mouseover', function() {
                const user = 'vlvovch';
                const domain = 'gmail.com';
                emailLink.setAttribute('title', user + '@' + domain);
            });
            
            // Reset title on mouseout
            emailLink.addEventListener('mouseout', function() {
                emailLink.setAttribute('title', 'Email me');
            });
        });
    </script>
